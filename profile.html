<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALVIN Profile</title>
    <link rel="stylesheet" href="profile.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
/* ================================================================
   PROFILE — Instagram Mobile Style  (≤768px)
================================================================ */
@media (max-width: 768px) {

body { background: #000 !important; }

.top-nav {
    background: #000 !important;
    border-bottom: 1px solid #262626 !important;
    padding: 0 16px !important;
    height: 54px !important;
    backdrop-filter: none !important;
    position: sticky !important; top: 0 !important; z-index: 100 !important;
    display: flex !important; align-items: center !important; justify-content: space-between !important;
}
.brand-name { font-size: 1rem !important; font-weight: 700 !important; letter-spacing: 1px !important; }
.nav-link { font-size: 1.2rem !important; padding: 6px 8px !important; color: #fff !important; }
.btn-logout { font-size: 0.78rem !important; padding: 5px 10px !important; border: 1px solid #363636 !important; border-radius: 8px !important; }

.profile-main { padding: 16px 16px 0 !important; max-width: 100% !important; }

.profile-header-section {
    display: flex !important; flex-direction: row !important;
    gap: 20px !important; align-items: flex-start !important;
    margin-bottom: 16px !important; padding-bottom: 0 !important;
}
.avatar-wrap { flex-shrink: 0 !important; }
.avatar-ring { width: 86px !important; height: 86px !important; }
.avatar-img { width: 80px !important; height: 80px !important; }
.btn-change-photo { width: 26px !important; height: 26px !important; font-size: 0.7rem !important; }

.profile-info { flex: 1 !important; min-width: 0 !important; }
.profile-name-row { flex-direction: column !important; align-items: flex-start !important; gap: 8px !important; margin-bottom: 10px !important; }
.profile-username { font-size: 1rem !important; font-weight: 600 !important; }

.stats-row { display: flex !important; gap: 0 !important; justify-content: space-around !important; margin-bottom: 12px !important; }
.stat-item { display: flex !important; flex-direction: column !important; align-items: center !important; gap: 2px !important; flex: 1 !important; }
.stat-num { font-size: 1rem !important; font-weight: 700 !important; color: #fff !important; }
.stat-lbl { font-size: 0.72rem !important; color: #a8a8a8 !important; }

.btn-action { width: 100% !important; padding: 7px 12px !important; font-size: 0.85rem !important; font-weight: 600 !important; border-radius: 8px !important; }
.btn-edit { background: #262626 !important; border: none !important; color: #fff !important; }
.btn-follow { background: #0095f6 !important; border: none !important; color: #fff !important; }

.bio-section { max-width: 100% !important; margin-top: 4px !important; }
.bio-name { font-size: 0.85rem !important; font-weight: 700 !important; }
.bio-text { font-size: 0.82rem !important; line-height: 1.4 !important; }

.profile-tabs {
    border-top: 1px solid #262626 !important; border-bottom: none !important;
    margin: 12px -16px 0 !important; display: flex !important;
}
.tab-btn {
    flex: 1 !important; padding: 12px 0 !important; font-size: 0.8rem !important;
    border-radius: 0 !important; background: none !important; border: none !important;
    border-top: 2px solid transparent !important; color: #a8a8a8 !important; font-weight: 600 !important;
}
.tab-btn.active { border-top-color: #fff !important; color: #fff !important; }

.posts-grid { gap: 2px !important; margin: 2px -16px 0 !important; grid-template-columns: repeat(3, 1fr) !important; }

.post-modal-inner {
    flex-direction: column !important; width: 100% !important;
    max-width: 100vw !important; max-height: 95dvh !important;
    border-radius: 16px 16px 0 0 !important;
    position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important; margin: 0 !important;
}
.post-media-side { max-height: 45vh !important; border-radius: 16px 16px 0 0 !important; }
.post-info-side { width: 100% !important; border-left: none !important; border-top: 1px solid #262626 !important; padding: 12px 16px !important; }

.side-modal { position: fixed !important; inset: 0 !important; z-index: 9999 !important; align-items: flex-end !important; }
.side-modal[style*="display: flex"], .side-modal[style*="display:flex"] { display: flex !important; }
.side-modal-content { width: 100% !important; border-radius: 16px 16px 0 0 !important; background: #1c1c1c !important; padding: 20px 16px 32px !important; max-height: 85dvh !important; overflow-y: auto !important; }

#igNavBar {
    display: flex !important; align-items: center !important; justify-content: space-around !important;
    background: #000 !important; border-top: 1px solid #262626 !important;
    height: calc(49px + env(safe-area-inset-bottom, 0px)) !important;
    padding-bottom: env(safe-area-inset-bottom, 0px) !important;
    position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important; z-index: 300 !important;
}
.ig-nav-btn {
    flex: 1 !important; height: 100% !important;
    display: flex !important; align-items: center !important; justify-content: center !important;
    background: none !important; border: none !important; cursor: pointer !important;
    font-size: 1.5rem !important; color: #fff !important; position: relative !important; padding-top: 4px !important;
}
.ig-nav-btn:active { opacity: 0.5 !important; }
.ig-nav-btn.active::after {
    content: '' !important; position: absolute !important; bottom: 6px !important;
    left: 50% !important; transform: translateX(-50%) !important;
    width: 5px !important; height: 5px !important; border-radius: 50% !important; background: #fff !important;
}
#profileContainer { padding-bottom: calc(49px + env(safe-area-inset-bottom, 0px)) !important; }

} /* END @media */
    </style>
</head>
<body>

<!-- AUTH CHECK -->
<div id="authCheck" class="auth-check" style="display:none;">
    <div class="auth-message">
        <div class="auth-icon">🔒</div>
        <h2>Login Diperlukan</h2>
        <p>Silakan login terlebih dahulu untuk mengakses halaman profil</p>
        <button onclick="window.location.href='index.html'">Kembali ke Homepage</button>
    </div>
</div>

<!-- LOADING SPINNER (tampil sementara auth check berlangsung) -->
<div id="profileLoading" style="display:flex;align-items:center;justify-content:center;min-height:100dvh;background:#000;flex-direction:column;gap:16px;">
    <div style="width:36px;height:36px;border:3px solid #262626;border-top-color:#0095f6;border-radius:50%;animation:profileSpin 0.8s linear infinite;"></div>
    <p style="color:#a8a8a8;font-size:0.85rem;margin:0;">Memuat profil...</p>
</div>
<style>
@keyframes profileSpin { to { transform: rotate(360deg); } }
</style>

<!-- PROFILE CONTAINER -->
<div id="profileContainer" class="profile-container" style="display:none;">

    <!-- TOP NAV -->
    <header class="top-nav">
        <div class="nav-brand">
            <span class="brand-icon">▲</span>
            <span class="brand-name">ALVIN</span>
        </div>
        <nav class="nav-links">
            <a href="index.html" class="nav-link">🏠</a>
            <a href="reels.html" class="nav-link">🎬</a>
            <a href="chat.html" class="nav-link">💬</a>
            <button class="nav-link btn-logout" onclick="logoutProfile()">Keluar</button>
        </nav>
    </header>

    <!-- PROFILE BODY -->
    <main class="profile-main">

        <!-- PROFILE HEADER -->
        <section class="profile-header-section">
            <!-- Avatar -->
            <div class="avatar-wrap">
                <div class="avatar-ring">
                    <img id="profilePic" class="avatar-img" src="https://ui-avatars.com/api/?background=3b82f6&color=fff&size=150" alt="Profile">
                </div>
                <button class="btn-change-photo" onclick="document.getElementById('photoUpload').click()" title="Ganti foto">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                </button>
                <input type="file" id="photoUpload" accept="image/*" style="display:none;">
            </div>

            <!-- Info -->
            <div class="profile-info">
                <div class="profile-name-row">
                    <h1 id="profileName" class="profile-username">username</h1>
                    <button id="btnEditProfile" class="btn-action btn-edit" onclick="openEditModal()">Edit Profil</button>
                    <!-- tombol ini muncul saat lihat profil orang lain -->
                    <button id="btnFollowUser" class="btn-action btn-follow" onclick="toggleFollow()" style="display:none;">Ikuti</button>
                </div>

                <!-- Stats Row -->
                <div class="stats-row">
                    <div class="stat-item">
                        <span class="stat-num" id="totalPosts">0</span>
                        <span class="stat-lbl">kiriman</span>
                    </div>
                    <div class="stat-item clickable" onclick="showFollowersList()">
                        <span class="stat-num" id="totalFollowers">0</span>
                        <span class="stat-lbl">pengikut</span>
                    </div>
                    <div class="stat-item clickable" onclick="showFollowingList()">
                        <span class="stat-num" id="totalFollowing">0</span>
                        <span class="stat-lbl">mengikuti</span>
                    </div>
                </div>

                <!-- Bio -->
                <div class="bio-section">
                    <span class="bio-name" id="bioName"></span>
                    <p id="profileDesc" class="bio-text">Belum ada deskripsi</p>
                </div>
            </div>
        </section>

        <!-- TABS -->
        <div class="profile-tabs">
            <button class="tab-btn active" id="tabPosts" onclick="switchTab('posts')">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                KIRIMAN
            </button>
            <button class="tab-btn" id="tabLiked" onclick="switchTab('liked')">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                DISUKAI
            </button>
        </div>

        <!-- GRID -->
        <div class="posts-grid" id="galleryGrid"></div>
        <div class="posts-grid" id="likedGrid" style="display:none;"></div>

    </main>
</div>

<!-- ===== POST VIEWER MODAL ===== -->
<div id="postModal" class="post-modal" onclick="closePostModal(event)">
    <button class="modal-x" onclick="closePostModal()">✕</button>
    <div class="post-modal-inner" onclick="event.stopPropagation()">
        <!-- MEDIA SIDE -->
        <div class="post-media-side" id="postMediaSide">
            <!-- video/img injected here -->
        </div>
        <!-- INFO SIDE -->
        <div class="post-info-side">
            <!-- author -->
            <div class="post-author-bar">
                <img id="modalAuthorPic" class="post-author-pic" src="" alt="">
                <div>
                    <span id="modalAuthorName" class="post-author-name"></span>
                    <span id="modalPostDate" class="post-date"></span>
                </div>
                <button id="modalDeleteBtn" class="btn-modal-delete" onclick="confirmDeleteReelModal()" title="Hapus">🗑️</button>
            </div>
            <!-- caption -->
            <p id="modalCaption" class="post-caption"></p>
            <!-- stats bar -->
            <div class="modal-stats-bar">
                <span id="modalLikes" class="modal-stat">❤️ <b>0</b> suka</span>
                <span id="modalComments" class="modal-stat">💬 <b>0</b> komentar</span>
            </div>
            <!-- comments list -->
            <div class="comments-list" id="commentsList"></div>
            <!-- like + comment actions -->
            <div class="post-actions-bar">
                <button class="post-action-btn" id="btnModalLike" onclick="toggleLikeModal()">
                    <span id="likeIcon">🤍</span>
                </button>
                <div class="comment-input-wrap">
                    <input type="text" id="commentInput" class="comment-input" placeholder="Tambahkan komentar…" maxlength="200">
                    <button class="btn-send-comment" onclick="postComment()">Kirim</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ===== EDIT PROFILE MODAL ===== -->
<div id="editModal" class="side-modal" style="display:none;">
    <div class="side-modal-content">
        <div class="side-modal-header">
            <h2>Edit Profil</h2>
            <button class="modal-x-sm" onclick="closeEditModal()">✕</button>
        </div>
        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="editName" placeholder="Nama kamu" maxlength="100">
        </div>
        <div class="form-group">
            <label>Bio <span id="descCount" class="char-count">0</span>/150</label>
            <textarea id="editDesc" placeholder="Ceritakan tentang dirimu…" maxlength="150" rows="3"></textarea>
        </div>
        <button class="btn-save" onclick="saveProfile()">Simpan</button>
    </div>
</div>

<!-- ===== FOLLOWERS/FOLLOWING MODAL ===== -->
<div id="peopleModal" class="side-modal" style="display:none;">
    <div class="side-modal-content">
        <div class="side-modal-header">
            <h2 id="peopleModalTitle">Pengikut</h2>
            <button class="modal-x-sm" onclick="closePeopleModal()">✕</button>
        </div>
        <div id="peopleList" class="people-list"></div>
    </div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, get, set, update, remove, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyDzDRaHEASBWO0dDKOIlvlku3lN01b89iw",
    authDomain: "alvin-f573e.firebaseapp.com",
    projectId: "alvin-f573e",
    storageBucket: "alvin-f573e.firebasestorage.app",
    messagingSenderId: "718704784181",
    appId: "1:718704784181:web:db5fe912a3cb3b0675d27c",
    measurementId: "G-NHLWBMV307",
    databaseURL: "https://alvin-f573e-default-rtdb.asia-southeast1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;
let viewingUid = null; // uid profil yang sedang dilihat (bisa sendiri atau orang lain)
let userReels = [];
let currentReelId = null;
let followersCache = {};
let followingCache = {};
let unsubs = [];

// ---- Parse ?uid= from URL ----
const urlParams = new URLSearchParams(window.location.search);
const targetUid = urlParams.get('uid'); // null kalau profil sendiri

onAuthStateChanged(auth, async (user) => {
    // Sembunyikan loading spinner
    const loadingEl = document.getElementById('profileLoading');
    if (loadingEl) loadingEl.style.display = 'none';

    if (user) {
        currentUser = user;
        viewingUid = targetUid || user.uid;

        document.getElementById('authCheck').style.display = 'none';
        document.getElementById('profileContainer').style.display = 'block';

        loadProfile(viewingUid);
        loadReels(viewingUid);

        if (viewingUid !== currentUser.uid) {
            // Lihat profil orang lain
            document.getElementById('btnEditProfile').style.display = 'none';
            document.getElementById('btnFollowUser').style.display = 'inline-flex';
            checkFollowStatus();
        }
    } else {
        document.getElementById('authCheck').style.display = 'flex';
        document.getElementById('profileContainer').style.display = 'none';
    }
});

// ======== LOAD PROFILE ========
function loadProfile(uid) {
    const userRef = ref(db, 'users/' + uid);
    const unsub = onValue(userRef, async (snap) => {
        if (!snap.exists()) return;
        const d = snap.val();
        const name = d.fullname || 'User';
        document.getElementById('profileName').textContent = name;
        document.getElementById('bioName').textContent = name;
        document.getElementById('profileDesc').textContent = d.description || '';
        if (d.photoURL) document.getElementById('profilePic').src = d.photoURL;
        document.getElementById('editName').value = name;
        document.getElementById('editDesc').value = d.description || '';
        document.getElementById('descCount').textContent = (d.description || '').length;
    });
    unsubs.push(unsub);

    // Followers count
    const folRef = ref(db, 'follows/' + uid + '/followers');
    const unsub2 = onValue(folRef, snap => {
        followersCache = snap.val() || {};
        document.getElementById('totalFollowers').textContent = formatCount(Object.keys(followersCache).length);
    });
    unsubs.push(unsub2);

    // Following count
    const fngRef = ref(db, 'follows/' + uid + '/following');
    const unsub3 = onValue(fngRef, snap => {
        followingCache = snap.val() || {};
        document.getElementById('totalFollowing').textContent = formatCount(Object.keys(followingCache).length);
    });
    unsubs.push(unsub3);
}

// ======== LOAD REELS ========
function loadReels(uid) {
    const reelsRef = ref(db, 'reels');
    const unsub = onValue(reelsRef, async (snap) => {
        const all = [];
        snap.forEach(child => {
            const d = child.val();
            if (d.userId === uid) all.push({ id: child.key, ...d });
        });
        all.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        userReels = all;
        document.getElementById('totalPosts').textContent = all.length;
        renderGrid(all, 'galleryGrid', uid === currentUser.uid);
        loadLikedPosts();
    });
    unsubs.push(unsub);
}

function renderGrid(reels, gridId, isOwner) {
    const grid = document.getElementById(gridId);
    grid.innerHTML = '';
    if (!reels.length) {
        grid.innerHTML = '<p class="empty-state">' + (isOwner ? 'Belum ada kiriman. <a href="reels.html">Upload sekarang!</a>' : 'Belum ada kiriman.') + '</p>';
        return;
    }
    reels.forEach(reel => {
        const likeCount = Object.keys(reel.likes || {}).length;
        const commentCount = Object.keys(reel.comments || {}).length;
        const isVideo = reel.mediaType === 'video';

        const item = document.createElement('div');
        item.className = 'grid-item';
        item.onclick = () => openPostModal(reel.id);

        item.innerHTML = `
            <div class="grid-thumb">
                ${isVideo
                    ? `<video src="${reel.mediaUrl}" preload="metadata" muted></video><span class="video-badge">▶</span>`
                    : `<img src="${reel.mediaUrl}" alt="" onerror="this.src='https://via.placeholder.com/300x300/161b22/555?text=Error'">`
                }
                <div class="grid-hover">
                    <span>❤️ ${formatCount(likeCount)}</span>
                    <span>💬 ${formatCount(commentCount)}</span>
                </div>
                ${isOwner ? `<button class="grid-delete-btn" onclick="event.stopPropagation(); confirmDeleteReel('${reel.id}')">✕</button>` : ''}
            </div>
        `;
        grid.appendChild(item);
    });
}

async function loadLikedPosts() {
    if (!currentUser) return;
    // only show liked tab for own profile
    if (viewingUid !== currentUser.uid) {
        document.querySelector('[onclick="switchTab(\'liked\')"]').style.display = 'none';
        return;
    }
    const snap = await get(ref(db, 'reels'));
    const liked = [];
    snap.forEach(child => {
        const d = child.val();
        if (d.likes && d.likes[currentUser.uid]) liked.push({ id: child.key, ...d });
    });
    renderGrid(liked, 'likedGrid', false);
}

// ======== POST MODAL ========
window.openPostModal = async function(reelId) {
    currentReelId = reelId;
    const snap = await get(ref(db, 'reels/' + reelId));
    if (!snap.exists()) return;
    const reel = { id: reelId, ...snap.val() };

    // media
    const mediaSide = document.getElementById('postMediaSide');
    if (reel.mediaType === 'video') {
        mediaSide.innerHTML = `<video src="${reel.mediaUrl}" controls autoplay class="modal-media"></video>`;
    } else {
        mediaSide.innerHTML = `<img src="${reel.mediaUrl}" class="modal-media" alt="">`;
    }

    // author
    const authorSnap = await get(ref(db, 'users/' + reel.userId));
    const author = authorSnap.val() || {};
    document.getElementById('modalAuthorPic').src = author.photoURL || 'https://ui-avatars.com/api/?background=3b82f6&color=fff&size=40';
    document.getElementById('modalAuthorName').textContent = author.fullname || 'User';

    const date = reel.createdAt ? new Date(reel.createdAt).toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' }) : '';
    document.getElementById('modalPostDate').textContent = date;
    document.getElementById('modalCaption').textContent = reel.caption || '';

    const likeCount = Object.keys(reel.likes || {}).length;
    const commentCount = Object.keys(reel.comments || {}).length;
    document.getElementById('modalLikes').innerHTML = `❤️ <b>${formatCount(likeCount)}</b> suka`;
    document.getElementById('modalComments').innerHTML = `💬 <b>${formatCount(commentCount)}</b> komentar`;

    // delete btn
    const delBtn = document.getElementById('modalDeleteBtn');
    delBtn.style.display = (reel.userId === currentUser.uid) ? 'flex' : 'none';

    // like status
    const liked = reel.likes && reel.likes[currentUser.uid];
    document.getElementById('likeIcon').textContent = liked ? '❤️' : '🤍';

    // comments
    renderComments(reel.comments || {});

    document.getElementById('postModal').style.display = 'flex';
};

function renderComments(comments) {
    const list = document.getElementById('commentsList');
    list.innerHTML = '';
    const sorted = Object.entries(comments).sort((a,b) => (a[1].createdAt||0)-(b[1].createdAt||0));
    sorted.forEach(([id, c]) => {
        const div = document.createElement('div');
        div.className = 'comment-item';
        div.innerHTML = `<span class="comment-author">${escapeHtml(c.userName||'User')}</span> <span class="comment-text">${escapeHtml(c.text||'')}</span>`;
        list.appendChild(div);
    });
}

window.closePostModal = function(e) {
    if (e && e.target !== document.getElementById('postModal') && !document.querySelector('.modal-x')) return;
    if (e && e.currentTarget === document.getElementById('postModal') && e.target !== e.currentTarget) return;
    document.getElementById('postModal').style.display = 'none';
    currentReelId = null;
    // stop video
    const v = document.querySelector('#postMediaSide video');
    if (v) v.pause();
};

window.toggleLikeModal = async function() {
    if (!currentReelId) return;
    const likeRef = ref(db, `reels/${currentReelId}/likes/${currentUser.uid}`);
    const snap = await get(likeRef);
    if (snap.exists()) {
        await remove(likeRef);
        document.getElementById('likeIcon').textContent = '🤍';
    } else {
        await set(likeRef, true);
        document.getElementById('likeIcon').textContent = '❤️';
    }
    // refresh counts
    const reelSnap = await get(ref(db, 'reels/' + currentReelId));
    const reel = reelSnap.val() || {};
    document.getElementById('modalLikes').innerHTML = `❤️ <b>${formatCount(Object.keys(reel.likes||{}).length)}</b> suka`;
};

window.postComment = async function() {
    const input = document.getElementById('commentInput');
    const text = input.value.trim();
    if (!text || !currentReelId) return;

    const userSnap = await get(ref(db, 'users/' + currentUser.uid));
    const userData = userSnap.val() || {};

    const commentsRef = ref(db, `reels/${currentReelId}/comments`);
    await push(commentsRef, {
        userId: currentUser.uid,
        userName: userData.fullname || 'User',
        text,
        createdAt: Date.now()
    });
    input.value = '';

    // refresh
    const reelSnap = await get(ref(db, 'reels/' + currentReelId));
    const reel = reelSnap.val() || {};
    renderComments(reel.comments || {});
    document.getElementById('modalComments').innerHTML = `💬 <b>${formatCount(Object.keys(reel.comments||{}).length)}</b> komentar`;
};

// ======== FOLLOW ========
async function checkFollowStatus() {
    if (!currentUser) return;
    const snap = await get(ref(db, `follows/${viewingUid}/followers/${currentUser.uid}`));
    const btn = document.getElementById('btnFollowUser');
    if (snap.exists()) {
        btn.textContent = 'Mengikuti';
        btn.classList.add('following');
    } else {
        btn.textContent = 'Ikuti';
        btn.classList.remove('following');
    }
}

window.toggleFollow = async function() {
    if (!currentUser || viewingUid === currentUser.uid) return;
    const snap = await get(ref(db, `follows/${viewingUid}/followers/${currentUser.uid}`));
    if (snap.exists()) {
        // Unfollow
        await remove(ref(db, `follows/${viewingUid}/followers/${currentUser.uid}`));
        await remove(ref(db, `follows/${currentUser.uid}/following/${viewingUid}`));
    } else {
        // Follow
        await set(ref(db, `follows/${viewingUid}/followers/${currentUser.uid}`), true);
        await set(ref(db, `follows/${currentUser.uid}/following/${viewingUid}`), true);
    }
    checkFollowStatus();
};

// ======== FOLLOWERS/FOLLOWING MODAL ========
window.showFollowersList = async function() {
    document.getElementById('peopleModalTitle').textContent = 'Pengikut';
    const snap = await get(ref(db, `follows/${viewingUid}/followers`));
    const uids = snap.val() ? Object.keys(snap.val()) : [];
    populatePeopleList(uids);
    document.getElementById('peopleModal').style.display = 'flex';
};

window.showFollowingList = async function() {
    document.getElementById('peopleModalTitle').textContent = 'Mengikuti';
    const snap = await get(ref(db, `follows/${viewingUid}/following`));
    const uids = snap.val() ? Object.keys(snap.val()) : [];
    populatePeopleList(uids);
    document.getElementById('peopleModal').style.display = 'flex';
};

async function populatePeopleList(uids) {
    const list = document.getElementById('peopleList');
    list.innerHTML = '<p class="loading-text">Memuat…</p>';
    if (!uids.length) { list.innerHTML = '<p class="empty-state">Tidak ada.</p>'; return; }
    const items = await Promise.all(uids.map(async uid => {
        const snap = await get(ref(db, 'users/' + uid));
        const u = snap.val() || {};
        return { uid, name: u.fullname || 'User', photo: u.photoURL || '' };
    }));
    list.innerHTML = '';
    items.forEach(u => {
        const div = document.createElement('div');
        div.className = 'people-item';
        div.innerHTML = `
            <img src="${u.photo || `https://ui-avatars.com/api/?background=3b82f6&color=fff&size=40&name=${encodeURIComponent(u.name)}`}" class="people-pic" alt="">
            <span class="people-name">${escapeHtml(u.name)}</span>
            <a href="profile.html?uid=${u.uid}" class="people-visit">Lihat</a>
        `;
        list.appendChild(div);
    });
}

window.closePeopleModal = function() { document.getElementById('peopleModal').style.display = 'none'; };

// ======== EDIT PROFILE ========
window.openEditModal = function() { document.getElementById('editModal').style.display = 'flex'; };
window.closeEditModal = function() { document.getElementById('editModal').style.display = 'none'; };

document.getElementById('editDesc').addEventListener('input', function() {
    document.getElementById('descCount').textContent = this.value.length;
});

window.saveProfile = async function() {
    const name = document.getElementById('editName').value.trim();
    const desc = document.getElementById('editDesc').value.trim();
    if (!name) { alert('Nama tidak boleh kosong'); return; }
    try {
        await update(ref(db, 'users/' + currentUser.uid), { fullname: name, description: desc });
        closeEditModal();
    } catch(e) { alert('Error: ' + e.message); }
};

// ======== PHOTO ========
document.getElementById('photoUpload').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { alert('File terlalu besar! Maks 5MB'); return; }
    const reader = new FileReader();
    reader.onload = async (ev) => {
        await update(ref(db, 'users/' + currentUser.uid), { photoURL: ev.target.result });
        document.getElementById('profilePic').src = ev.target.result;
    };
    reader.readAsDataURL(file);
});

// ======== DELETE REEL ========
window.confirmDeleteReel = async function(reelId) {
    if (!confirm('Hapus kiriman ini?')) return;
    await remove(ref(db, 'reels/' + reelId));
};
window.confirmDeleteReelModal = async function() {
    if (!currentReelId) return;
    if (!confirm('Hapus kiriman ini?')) return;
    await remove(ref(db, 'reels/' + currentReelId));
    closePostModal();
};

// ======== TABS ========
window.switchTab = function(tab) {
    document.getElementById('galleryGrid').style.display = tab === 'posts' ? 'grid' : 'none';
    document.getElementById('likedGrid').style.display = tab === 'liked' ? 'grid' : 'none';
    document.getElementById('tabPosts').classList.toggle('active', tab === 'posts');
    document.getElementById('tabLiked').classList.toggle('active', tab === 'liked');
};

// ======== LOGOUT ========
window.logoutProfile = function() {
    if (!confirm('Logout?')) return;
    unsubs.forEach(u => u && u());
    signOut(auth).then(() => window.location.href = 'index.html').catch(e => alert(e.message));
};

// ======== UTILS ========
function formatCount(n) {
    if (n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/,'') + ' jt';
    if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + ' rb';
    return n;
}
function escapeHtml(t) {
    const d = document.createElement('div');
    d.textContent = t;
    return d.innerHTML;
}
</script>
