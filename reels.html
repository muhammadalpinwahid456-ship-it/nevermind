<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALVIN Reels</title>
    <link rel="stylesheet" href="reels.css">
</head>
<body>
    <!-- AUTH CHECK -->
    <div id="authCheck" class="auth-check">
        <div class="auth-message">
            <h2>⚠️ Silakan Login Terlebih Dahulu</h2>
            <p>Anda harus login untuk mengakses fitur reels</p>
            <button onclick="window.location.href='index.html'">Kembali ke Homepage</button>
        </div>
    </div>

    <!-- REELS CONTAINER -->
    <div id="reelsContainer" class="reels-container" style="display: none;">
        <!-- LEFT SIDEBAR NAVIGATION -->
        <aside class="reels-sidebar-nav">
            <div class="nav-logo">
                <span style="font-size: 1.6rem;">🎬</span>
                <h2>Reels</h2>
            </div>
            
            <nav class="nav-buttons">
                <button class="nav-btn notif-btn" onclick="toggleNotifPanel()" title="Notifikasi" id="notifNavBtn">
                    <span class="nav-icon notif-icon-wrap">
                        🔔
                        <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
                    </span>
                    <span>Notifikasi</span>
                </button>
                <button class="nav-btn" onclick="openUploadModal()" title="Upload">
                    <span class="nav-icon">➕</span>
                    <span>Upload</span>
                </button>
                <button class="nav-btn" onclick="window.location.href='profile.html'" title="Profile">
                    <span class="nav-icon">👤</span>
                    <span>Profile</span>
                </button>
                <button class="nav-btn" onclick="window.location.href='index.html'" title="Home">
                    <span class="nav-icon">🏠</span>
                    <span>Home</span>
                </button>
                <button class="nav-btn" onclick="window.location.href='chat.html'" title="Chat">
                    <span class="nav-icon">💬</span>
                    <span>Chat</span>
                </button>
            </nav>

            <button class="nav-btn logout-btn" onclick="logoutReels()" title="Logout">
                <span class="nav-icon">🚪</span>
                <span>Logout</span>
            </button>
        </aside>

        <!-- LOADING SPINNER -->
        <div id="loadingSpinner" class="loading-spinner" style="display: none;">
            <div class="spinner"></div>
            <p>Loading reels...</p>
        </div>

        <!-- ERROR MESSAGE -->
        <div id="errorMessage" class="error-message" style="display: none;">
            <div class="error-content">
                <h2>❌ Error</h2>
                <p id="errorText"></p>
                <button onclick="location.reload()">Coba Lagi</button>
            </div>
        </div>

        <!-- MAIN REELS AREA -->
        <div class="reels-main" id="reelsMain" style="display: none;">
            <div class="reels-viewer">
                <div id="reelsCarousel" class="reels-carousel">
                    <!-- Reels akan ditampilkan di sini -->
                </div>

                <!-- RIGHT SIDEBAR ACTIONS -->
                <div class="reels-actions-sidebar">
                    <button class="action-btn like-btn" id="likeBtn" onclick="toggleLike(event)">
                        <span class="icon">♡</span>
                        <span class="count" id="likeCount">0</span>
                    </button>
                    <button class="action-btn comment-btn" onclick="toggleComments(event)">
                        <span class="icon">💬</span>
                        <span class="count" id="commentCount">0</span>
                    </button>
                </div>
            </div>

            <!-- COMMENTS PANEL (RIGHT) -->
            <div id="commentsPanel" class="comments-panel" style="display: none;">
                <div class="comments-header">
                    <h3>Komentar</h3>
                    <button class="close-comments" onclick="toggleComments(event)">✕</button>
                </div>
                <div class="comments-list" id="commentsList">
                    <!-- Comments akan ditampilkan di sini -->
                </div>
                <div class="reply-indicator" id="replyIndicator" style="display:none;">
                    <span id="replyIndicatorText">Membalas <strong></strong></span>
                    <button class="cancel-reply-btn" onclick="cancelReply(event)">✕ Batal</button>
                </div>
                <div class="comment-input-area">
                    <div class="comment-photo-preview" id="commentPhotoPreview" style="display:none;">
                        <img id="commentPhotoImg" src="" alt="preview foto">
                        <button class="remove-comment-photo" onclick="removeCommentPhoto(event)" title="Hapus foto">✕</button>
                    </div>
                    <div class="comment-input-row">
                        <button class="comment-photo-btn" onclick="triggerCommentPhotoInput(event)" title="Kirim foto">📷</button>
                        <input 
                            type="file" 
                            id="commentPhotoInput" 
                            accept="image/*" 
                            style="display:none;"
                            onchange="handleCommentPhotoSelect(event)"
                        >
                        <input 
                            type="text" 
                            id="commentInput" 
                            placeholder="Tambahkan komentar..." 
                            onkeypress="handleCommentKeyPress(event)"
                            onclick="event.stopPropagation()"
                        >
                        <button onclick="sendComment(event)" id="sendCommentBtn">Kirim</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- UPLOAD MODAL -->
    <div id="uploadModal" class="modal" style="display: none;">
        <div class="modal-content">
            <button class="modal-close" onclick="closeUploadModal()">✕</button>
            <h2>Upload Reels</h2>
            
            <form id="uploadForm" onsubmit="handleUploadSubmit(event)">
                <div class="form-group">
                    <label for="reelCaption">Caption</label>
                    <textarea 
                        id="reelCaption" 
                        placeholder="Tulis caption untuk reels Anda..." 
                        maxlength="300"
                        rows="3"
                    ></textarea>
                    <span class="char-count"><span id="captionCount">0</span>/300</span>
                </div>

                <div class="form-group">
                    <label>Upload Video atau Foto</label>
                    <div class="file-input-wrapper">
                        <input 
                            type="file" 
                            id="reelFile" 
                            accept="image/*,video/*" 
                            required
                            onchange="previewMedia()"
                        >
                        <label for="reelFile" class="file-input-label">
                            <span class="icon">📹</span>
                            <span>Klik untuk memilih video atau foto</span>
                        </label>
                    </div>
                    <div class="preview-area" id="previewArea"></div>
                </div>

                <!-- Progress Bar -->
                <div id="uploadProgress" style="display: none; margin-bottom: 15px;">
                    <div style="font-size: 0.85rem; color: #8b949e; margin-bottom: 8px;">
                        <span id="progressText">Uploading...</span> <span id="progressPercent">0%</span>
                    </div>
                    <div style="width: 100%; height: 6px; background: #2d333b; border-radius: 3px; overflow: hidden;">
                        <div id="progressBar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #3b82f6, #2563eb); transition: width 0.3s;"></div>
                    </div>
                </div>

                <button type="submit" class="btn-upload-submit" id="submitBtn">Upload</button>
            </form>
        </div>
    </div>

    <!-- NOTIFICATION PANEL -->
    <div id="notifPanel" class="notif-panel" style="display:none;">
        <div class="notif-panel-header">
            <h3>Notifikasi</h3>
            <div class="notif-header-actions">
                <button class="notif-mark-all" onclick="markAllRead()">Tandai semua dibaca</button>
                <button class="notif-close-btn" onclick="toggleNotifPanel()">✕</button>
            </div>
        </div>
        <div class="notif-tabs">
            <button class="notif-tab active" onclick="switchNotifTab('all', this)">Semua</button>
            <button class="notif-tab" onclick="switchNotifTab('reels', this)">Reels</button>
            <button class="notif-tab" onclick="switchNotifTab('notes', this)">Notes</button>
        </div>
        <div class="notif-list" id="notifList">
            <div class="notif-empty">
                <span>🔔</span>
                <p>Belum ada notifikasi</p>
            </div>
        </div>
    </div>
    <div id="notifOverlay" class="notif-overlay" onclick="toggleNotifPanel()" style="display:none;"></div>

    <!-- FIREBASE & CLOUDINARY SCRIPTS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import {
            getDatabase,
            ref,
            onValue,
            push,
            get,
            set,
            update,
            remove
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        // ===== CLOUDINARY CONFIG =====
        const CLOUDINARY_CLOUD_NAME = "djc9oemca";
        const CLOUDINARY_UPLOAD_PRESET = "reels_upload";

        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyDzDRaHEASBWO0dDKOIlvlku3lN01b89iw",
            authDomain: "alvin-f573e.firebaseapp.com",
            projectId: "alvin-f573e",
            storageBucket: "alvin-f573e.firebasestorage.app",
            messagingSenderId: "718704784181",
            appId: "1:718704784181:web:db5fe912a3cb3b0675d27c",
            measurementId: "G-NHLWBMV307",
            databaseURL: "https://alvin-f573e-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        let currentUser = null;
        let allReels = [];
        let currentReelIndex = 0;
        let currentUserData = null;
        let reelsUnsubscribe = null;
        let commentsUnsubscribe = null;
        let loadTimeout = null;
        let currentVideoElement = null;
        // Reply state
        let replyTo = null; // { commentId, userName }

        // ===== NOTIFICATION SYSTEM =====
        let notifUnsubscribes = [];
        let allNotifications = [];
        let currentNotifTab = 'all';
        let seenNotifIds = new Set(JSON.parse(localStorage.getItem('seenNotifs') || '[]'));

        window.toggleNotifPanel = function() {
            const panel = document.getElementById('notifPanel');
            const overlay = document.getElementById('notifOverlay');
            const isOpen = panel.style.display !== 'none';
            panel.style.display = isOpen ? 'none' : 'flex';
            overlay.style.display = isOpen ? 'none' : 'block';
            if (!isOpen) {
                renderNotifList();
            }
        };

        window.switchNotifTab = function(tab, btn) {
            currentNotifTab = tab;
            document.querySelectorAll('.notif-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderNotifList();
        };

        window.markAllRead = function() {
            allNotifications.forEach(n => seenNotifIds.add(n.id));
            localStorage.setItem('seenNotifs', JSON.stringify([...seenNotifIds]));
            updateNotifBadge();
            renderNotifList();
        };

        function updateNotifBadge() {
            const unseen = allNotifications.filter(n => !seenNotifIds.has(n.id));
            const badge = document.getElementById('notifBadge');
            if (unseen.length > 0) {
                badge.style.display = 'flex';
                badge.textContent = unseen.length > 9 ? '9+' : unseen.length;
            } else {
                badge.style.display = 'none';
            }
        }

        function timeAgo(ts) {
            const diff = Date.now() - ts;
            const m = Math.floor(diff / 60000);
            if (m < 1) return 'baru saja';
            if (m < 60) return m + 'm';
            const h = Math.floor(m / 60);
            if (h < 24) return h + 'j';
            const d = Math.floor(h / 24);
            if (d < 7) return d + 'h';
            return Math.floor(d / 7) + 'mg';
        }

        function renderNotifList() {
            const list = document.getElementById('notifList');
            let filtered = allNotifications;
            if (currentNotifTab === 'reels') filtered = allNotifications.filter(n => n.source === 'reels');
            if (currentNotifTab === 'notes') filtered = allNotifications.filter(n => n.source === 'notes');

            filtered.sort((a, b) => b.timestamp - a.timestamp);

            if (filtered.length === 0) {
                list.innerHTML = '<div class="notif-empty"><span>🔔</span><p>Belum ada notifikasi</p></div>';
                return;
            }

            list.innerHTML = filtered.map(n => {
                const isNew = !seenNotifIds.has(n.id);
                let icon = '💬';
                if (n.type === 'like') icon = '❤️';
                else if (n.type === 'reply') icon = '↩️';

                let sourceTag = '<span class="notif-source-tag reels-tag">Reels</span>';
                if (n.source === 'notes') sourceTag = '<span class="notif-source-tag notes-tag">Notes</span>';
                else if (n.type === 'reply') sourceTag = '<span class="notif-source-tag reply-tag">Balasan</span>';

                const thumbHtml = n.mediaUrl
                    ? `<div class="notif-thumb"><img src="${n.mediaUrl}" alt="" onerror="this.style.display='none'"></div>`
                    : '';
                const dotHtml = isNew ? '<div class="notif-dot"></div>' : '';
                const unreadClass = isNew ? 'notif-unread' : '';
                const safeId = (n.id || '').replace(/'/g, "\\'");
                const safePhoto = (n.actorPhoto || 'https://via.placeholder.com/44').replace(/'/g, "\\'");

                return `<div class="notif-item ${unreadClass}" onclick="onNotifClick('${safeId}')">
                    <div class="notif-avatar-wrap">
                        <img src="${n.actorPhoto || 'https://via.placeholder.com/44'}" alt="" class="notif-avatar" onerror="this.src='https://via.placeholder.com/44'">
                        <span class="notif-type-icon">${icon}</span>
                    </div>
                    <div class="notif-body">
                        <p class="notif-text"><strong>${escapeHtml(n.actorName)}</strong> ${n.message}</p>
                        <div class="notif-meta">
                            <span class="notif-time">${timeAgo(n.timestamp)}</span>
                            ${sourceTag}
                        </div>
                    </div>
                    ${thumbHtml}
                    ${dotHtml}
                </div>`;
            }).join('');
        }

        window.onNotifClick = function(id) {
            seenNotifIds.add(id);
            localStorage.setItem('seenNotifs', JSON.stringify([...seenNotifIds]));
            updateNotifBadge();
            renderNotifList();
        };

        function loadNotifications(uid) {
            // Clear existing listeners
            notifUnsubscribes.forEach(u => u());
            notifUnsubscribes = [];
            allNotifications = [];

            // Listen to all reels — cari likes, komentar di reels SAYA,
            // dan balasan pada komentar SAYA di reels siapapun
            const reelsRef = ref(database, 'reels');
            const reelsNotifUnsub = onValue(reelsRef, (snapshot) => {
                allNotifications = allNotifications.filter(n => n.source !== 'reels');

                if (snapshot.exists()) {
                    snapshot.forEach((childSnap) => {
                        const reel = childSnap.val();
                        const reelId = childSnap.key;
                        const thumbUrl = reel.mediaType === 'image' ? reel.mediaUrl : null;
                        const isMyReel = reel.userId === uid;

                        const comments = reel.comments || {};

                        // Buat map commentId -> comment untuk lookup cepat
                        const commentMap = {};
                        Object.entries(comments).forEach(([cid, c]) => {
                            commentMap[cid] = c;
                        });

                        if (isMyReel) {
                            // === LIKES di reels saya ===
                            const likes = reel.likes || {};
                            Object.entries(likes).forEach(([likerId, val]) => {
                                if (likerId === uid || !val) return;
                                const notifId = 'reels_like_' + reelId + '_' + likerId;
                                allNotifications.push({
                                    id: notifId,
                                    source: 'reels',
                                    type: 'like',
                                    actorName: likerId,
                                    actorPhoto: 'https://via.placeholder.com/44',
                                    message: 'menyukai reels kamu',
                                    mediaUrl: thumbUrl,
                                    timestamp: reel.timestamp || Date.now(),
                                    likerId,
                                    reelId
                                });
                            });

                            // === KOMENTAR TOP-LEVEL di reels saya ===
                            Object.entries(comments).forEach(([commentId, comment]) => {
                                if (comment.userId === uid) return;
                                if (comment.parentCommentId) return; // skip replies, dihandle terpisah
                                const notifId = 'reels_comment_' + reelId + '_' + commentId;
                                const preview = comment.text && comment.text.length > 30
                                    ? comment.text.substring(0, 30) + '...' : comment.text;
                                allNotifications.push({
                                    id: notifId,
                                    source: 'reels',
                                    type: 'comment',
                                    actorName: comment.userName || 'Seseorang',
                                    actorPhoto: comment.userPhoto || 'https://via.placeholder.com/44',
                                    message: 'berkomentar: "' + preview + '"',
                                    mediaUrl: thumbUrl,
                                    timestamp: comment.timestamp || reel.timestamp || Date.now(),
                                    reelId
                                });
                            });
                        }

                        // === BALASAN pada komentar SAYA (di reels siapapun) ===
                        Object.entries(comments).forEach(([commentId, comment]) => {
                            if (!comment.parentCommentId) return; // hanya replies
                            if (comment.userId === uid) return; // bukan balasan dari saya sendiri

                            // Cek apakah komentar induknya milik saya
                            const parentComment = commentMap[comment.parentCommentId];
                            if (!parentComment) return;
                            if (parentComment.userId !== uid) return;

                            const notifId = 'reels_reply_' + reelId + '_' + commentId;
                            const preview = comment.text && comment.text.length > 30
                                ? comment.text.substring(0, 30) + '...' : comment.text;
                            allNotifications.push({
                                id: notifId,
                                source: 'reels',
                                type: 'reply',
                                actorName: comment.userName || 'Seseorang',
                                actorPhoto: comment.userPhoto || 'https://via.placeholder.com/44',
                                message: 'membalas komentar kamu: "' + preview + '"',
                                mediaUrl: thumbUrl,
                                timestamp: comment.timestamp || Date.now(),
                                reelId,
                                commentId: comment.parentCommentId
                            });
                        });
                    });
                }

                enrichLikerNames(uid).then(() => {
                    updateNotifBadge();
                    if (document.getElementById('notifPanel').style.display !== 'none') {
                        renderNotifList();
                    }
                });
            });
            notifUnsubscribes.push(reelsNotifUnsub);

            // Listen to notes likes
            // Struktur: notes/{userId}/likes/{likerId} = true|timestamp
            // Kita langsung listen ke notes/{uid}/likes
            const notesLikesRef = ref(database, `notes/${uid}/likes`);
            const notesNotifUnsub = onValue(notesLikesRef, (snapshot) => {
                allNotifications = allNotifications.filter(n => n.source !== 'notes');
                if (!snapshot.exists()) {
                    updateNotifBadge();
                    if (document.getElementById('notifPanel').style.display !== 'none') {
                        renderNotifList();
                    }
                    return;
                }

                snapshot.forEach((likerSnap) => {
                    const likerId = likerSnap.key;
                    const val = likerSnap.val();
                    // val bisa true atau timestamp — skip null
                    if (!val || likerId === uid) return;
                    const notifId = `notes_like_${uid}_${likerId}`;
                    allNotifications.push({
                        id: notifId,
                        source: 'notes',
                        type: 'like',
                        actorName: likerId,
                        actorPhoto: 'https://via.placeholder.com/44',
                        message: 'menyukai notes kamu',
                        mediaUrl: null,
                        timestamp: (typeof val === 'number' ? val : Date.now()),
                        likerId
                    });
                });

                enrichLikerNames(uid).then(() => {
                    updateNotifBadge();
                    if (document.getElementById('notifPanel').style.display !== 'none') {
                        renderNotifList();
                    }
                });
            });
            notifUnsubscribes.push(notesNotifUnsub);
        }

        async function enrichLikerNames(currentUid) {
            const likerIds = [...new Set(
                allNotifications
                    .filter(n => n.type === 'like' && n.likerId)
                    .map(n => n.likerId)
            )];

            await Promise.all(likerIds.map(async (lid) => {
                try {
                    const snap = await get(ref(database, 'users/' + lid));
                    if (snap.exists()) {
                        const u = snap.val();
                        allNotifications.forEach(n => {
                            if (n.likerId === lid) {
                                n.actorName = u.fullname || u.displayName || lid;
                                n.actorPhoto = u.photoURL || 'https://via.placeholder.com/44';
                            }
                        });
                    }
                } catch(e) {}
            }));
        }

        // TIMEOUT PROTECTION
        const LOAD_TIMEOUT = 10000;

        // ===== SHOW ERROR MESSAGE =====
        function showError(message) {
            console.error('❌ Error:', message);
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'flex';
            document.getElementById('errorText').textContent = message;
        }

        // ===== AUTH CHECK =====
        // Beri waktu Firebase restore sesi dari localStorage (maks 5 detik)
        let authResolved = false;
        const authFallbackTimer = setTimeout(() => {
            if (!authResolved) {
                authResolved = true;
                document.getElementById('authCheck').style.display = 'flex';
                document.getElementById('reelsContainer').style.display = 'none';
            }
        }, 5000);

        onAuthStateChanged(auth, (user) => {
            if (authResolved && !user) return; // sudah tampil auth check, skip
            authResolved = true;
            clearTimeout(authFallbackTimer);

            if (user) {
                currentUser = user;
                console.log('✅ User logged in:', user.email);
                document.getElementById('authCheck').style.display = 'none';
                document.getElementById('reelsContainer').style.display = 'flex';
                document.getElementById('loadingSpinner').style.display = 'flex';
                
                loadTimeout = setTimeout(() => {
                    if (document.getElementById('loadingSpinner').style.display !== 'none') {
                        showError('Timeout saat memuat reels. Periksa koneksi internet atau database rules.');
                    }
                }, LOAD_TIMEOUT);

                loadCurrentUser();
                loadAllReels();
                loadNotifications(user.uid);
            } else {
                console.log('❌ User not logged in');
                document.getElementById('authCheck').style.display = 'flex';
                document.getElementById('reelsContainer').style.display = 'none';
                if (reelsUnsubscribe) reelsUnsubscribe();
                if (commentsUnsubscribe) commentsUnsubscribe();
            }
        });

        // Load current user data
        function loadCurrentUser() {
            const userRef = ref(database, 'users/' + currentUser.uid);
            onValue(userRef, (snapshot) => {
                if (snapshot.exists()) {
                    currentUserData = snapshot.val();
                    console.log('✅ Current user loaded:', currentUserData.fullname);
                } else {
                    currentUserData = {
                        fullname: currentUser.displayName || currentUser.email.split('@')[0],
                        photoURL: 'https://via.placeholder.com/40',
                        email: currentUser.email
                    };
                    set(userRef, {
                        fullname: currentUserData.fullname,
                        photoURL: currentUserData.photoURL,
                        email: currentUser.email,
                        createdAt: new Date().toISOString()
                    }).catch(err => console.error('Error saving user:', err));
                }
            }, (error) => {
                console.error('❌ Error loading current user:', error);
            });
        }

        // Load semua reels
        function loadAllReels() {
            const reelsRef = ref(database, 'reels');
            
            if (reelsUnsubscribe) {
                reelsUnsubscribe();
            }

            console.log('📡 Fetching reels from database...');

            reelsUnsubscribe = onValue(
                reelsRef, 
                (snapshot) => {
                    if (loadTimeout) clearTimeout(loadTimeout);

                    console.log('📊 Snapshot received');
                    allReels = [];
                    
                    if (snapshot.exists()) {
                        snapshot.forEach((childSnapshot) => {
                            const reelId = childSnapshot.key;
                            const reelData = childSnapshot.val();
                            if (reelData && reelData.mediaUrl && reelData.mediaType) {
                                allReels.push({
                                    id: reelId,
                                    ...reelData
                                });
                            }
                        });
                        allReels.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                        console.log('✅ Total reels loaded:', allReels.length);
                    } else {
                        console.log('ℹ️ No reels found in database');
                    }
                    
                    document.getElementById('loadingSpinner').style.display = 'none';
                    document.getElementById('errorMessage').style.display = 'none';
                    document.getElementById('reelsMain').style.display = 'flex';
                    
                    displayReels();
                    
                    if (allReels.length > 0) {
                        setTimeout(() => playCurrentVideo(), 300);
                    }
                }, 
                (error) => {
                    if (loadTimeout) clearTimeout(loadTimeout);
                    console.error('❌ Error loading reels:', error);
                    showError(`Database Error: ${error.message}`);
                }
            );
        }

        // Display reels
        function displayReels() {
            const carousel = document.getElementById('reelsCarousel');
            carousel.innerHTML = '';

            if (allReels.length === 0) {
                carousel.innerHTML = '<div class="no-reels">Belum ada reels. <a href="#uploadModal" onclick="openUploadModal()">Upload yang pertama!</a></div>';
                return;
            }

            allReels.forEach((reel, index) => {
                const reelElement = document.createElement('div');
                reelElement.className = `reel-card ${index === currentReelIndex ? 'active' : ''}`;
                
                const videoId = `video-${reel.id}`;
                const mediaHtml = reel.mediaType === 'video' 
                    ? `<video 
                        id="${videoId}" 
                        src="${reel.mediaUrl}" 
                        preload="metadata" 
                        playsinline 
                        muted
                        style="width: 100%; height: 100%; object-fit: contain;" 
                        onerror="handleVideoError(this)">
                      </video>`
                    : `<img src="${reel.mediaUrl}" alt="reel" style="width: 100%; height: 100%; object-fit: contain;" onerror="handleImageError(this)">`

                reelElement.innerHTML = `
                    <div class="reel-media">
                        ${mediaHtml}
                    </div>
                    <div class="reel-info">
                        <div class="reel-user">
                            <img src="${reel.userPhoto || 'https://via.placeholder.com/40'}" alt="user" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
                            <h4>${escapeHtml(reel.userName)}</h4>
                        </div>
                        <p class="reel-caption">${escapeHtml(reel.caption)}</p>
                    </div>
                `;
                carousel.appendChild(reelElement);
            });

            setupCarouselScroll();
            updateUI();
        }

        // Setup carousel scroll
        function setupCarouselScroll() {
            const carousel = document.getElementById('reelsCarousel');
            carousel.removeEventListener('scroll', onCarouselScroll);
            carousel.addEventListener('scroll', onCarouselScroll, { passive: true });
        }

        function onCarouselScroll(e) {
            const carousel = e.target;
            const cards = Array.from(carousel.getElementsByClassName('reel-card'));
            let bestIdx = 0, bestVal = Infinity;
            
            cards.forEach((card, idx) => {
                const rect = card.getBoundingClientRect();
                const center = rect.top + rect.height / 2;
                const dist = Math.abs(center - window.innerHeight / 2);
                if (dist < bestVal) {
                    bestVal = dist;
                    bestIdx = idx;
                }
            });

            if (bestIdx !== currentReelIndex && bestIdx < allReels.length) {
                currentReelIndex = bestIdx;
                updateUI();
                playCurrentVideo();
                loadComments();
            }
        }

        // Play current video
        function playCurrentVideo() {
            if (allReels.length === 0) return;

            const currentReel = allReels[currentReelIndex];
            
            document.querySelectorAll('video').forEach(video => {
                video.pause();
                video.currentTime = 0;
                video.onended = null;
            });

            document.querySelectorAll('.reel-card').forEach((card, index) => {
                card.classList.toggle('active', index === currentReelIndex);
            });

            const videoId = `video-${currentReel.id}`;
            const videoElement = document.getElementById(videoId);
            
            if (videoElement && videoElement.tagName === 'VIDEO') {
                currentVideoElement = videoElement;
                
                videoElement.onended = () => {
                    videoElement.currentTime = 0;
                    videoElement.play();
                };

                setTimeout(() => {
                    videoElement.muted = false;
                    videoElement.volume = 1;
                    videoElement.play().catch(err => console.error('⚠️ Play error:', err));
                }, 100);
            }

            loadComments();
        }

        // Update UI
        function updateUI() {
            const currentReel = allReels[currentReelIndex];
            if (!currentReel) return;

            const likes = currentReel.likes || {};
            const isLiked = likes[currentUser.uid] === true;
            
            const likeBtn = document.getElementById('likeBtn');
            likeBtn.classList.toggle('liked', isLiked);
            document.getElementById('likeCount').textContent = Object.keys(likes).length;
            document.getElementById('commentCount').textContent = Object.keys(currentReel.comments || {}).length;
        }

        window.toggleReplies = function(commentId) {

        // Delete comment/reply
        window.deleteComment = async function(commentId, isReply, parentId) {
            const currentReel = allReels[currentReelIndex];
            if (!currentReel) return;
            if (!confirm('Hapus komentar ini?')) return;
            try {
                await remove(ref(database, 'reels/' + currentReel.id + '/comments/' + commentId));
                if (!isReply) {
                    const snap = await get(ref(database, 'reels/' + currentReel.id + '/comments'));
                    if (snap.exists()) {
                        const dels = [];
                        snap.forEach(child => {
                            if (child.val().parentCommentId === commentId) {
                                dels.push(remove(ref(database, 'reels/' + currentReel.id + '/comments/' + child.key)));
                            }
                        });
                        await Promise.all(dels);
                    }
                }
            } catch(e) {
                alert('Gagal menghapus: ' + e.message);
            }
        };

        // Load comments
        function loadComments() {
            const currentReel = allReels[currentReelIndex];
            if (!currentReel) return;

            if (commentsUnsubscribe) {
                commentsUnsubscribe();
            }

            const commentsRef = ref(database, 'reels/' + currentReel.id + '/comments');
            
            commentsUnsubscribe = onValue(commentsRef, (snapshot) => {
                const commentsList = document.getElementById('commentsList');
                commentsList.innerHTML = '';

                let commentsArray = [];
                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        commentsArray.push({
                            id: childSnapshot.key,
                            ...childSnapshot.val()
                        });
                    });
                }

                const topLevel = commentsArray.filter(c => !c.parentCommentId);
                const replies = commentsArray.filter(c => !!c.parentCommentId);

                topLevel.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

                if (topLevel.length === 0) {
                    commentsList.innerHTML = '<p class="no-comments">Belum ada komentar. Jadilah yang pertama! 💬</p>';
                    document.getElementById('commentCount').textContent = '0';
                    return;
                }

                const isOwner = currentReel.userId === currentUser.uid;

                topLevel.forEach(comment => {
                    const commentReplies = replies
                        .filter(r => r.parentCommentId === comment.id)
                        .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

                    const canDeleteComment = comment.userId === currentUser.uid || isOwner;
                    const timeStr = timeAgo(comment.timestamp || Date.now());

                    let repliesHtml = '';
                    commentReplies.forEach(reply => {
                        const canDeleteReply = reply.userId === currentUser.uid || isOwner;
                        const replyIsOwnerBadge = reply.userId === currentReel.userId
                            ? '<span class="owner-badge">Kreator</span>' : '';
                        const replyUserNameEsc = reply.userName.replace(/'/g, "\\'");
                        const replyPhotoHtml = reply.photoUrl
                            ? `<div class="comment-photo-attachment"><img src="${reply.photoUrl}" alt="foto komentar" onclick="openCommentPhoto('${reply.photoUrl}')" onerror="this.parentNode.style.display='none'"></div>`
                            : '';
                        repliesHtml += '<div class="reply-item" id="reply-' + reply.id + '">' +
                            '<img src="' + (reply.userPhoto || 'https://via.placeholder.com/28') + '" alt="user" class="reply-avatar" onerror="this.src=\'https://via.placeholder.com/28\'">' +
                            '<div class="reply-body">' +
                                '<div class="comment-meta-row">' +
                                    '<span class="comment-username">' + escapeHtml(reply.userName) + '</span>' +
                                    replyIsOwnerBadge +
                                    '<span class="comment-time">' + timeAgo(reply.timestamp || Date.now()) + '</span>' +
                                    (canDeleteReply ? '<button class="comment-delete-btn" onclick="deleteComment(\'' + reply.id + '\', true, \'' + comment.id + '\')">🗑</button>' : '') +
                                '</div>' +
                                '<p class="reply-text">' +
                                    (reply.replyToName ? '<span class="mention-tag">@' + escapeHtml(reply.replyToName) + '</span> ' : '') +
                                    escapeHtml(reply.text) +
                                '</p>' +
                                replyPhotoHtml +
                                '<div class="comment-actions-row">' +
                                    '<button class="reply-btn" onclick="setReply(\'' + comment.id + '\', \'' + replyUserNameEsc + '\')">↩ Balas</button>' +
                                '</div>' +
                            '</div>' +
                        '</div>';
                    });

                    const ownerBadge = comment.userId === currentReel.userId
                        ? '<span class="owner-badge">Kreator</span>' : '';
                    const commentUserNameEsc = comment.userName.replace(/'/g, "\\'");

                    const commentElement = document.createElement('div');
                    commentElement.className = 'comment-item';
                    commentElement.id = 'comment-' + comment.id;

                    let repliesSection = '';
                    if (commentReplies.length > 0) {
                        repliesSection = '<div class="replies-section">' +
                            '<button class="toggle-replies-btn" id="toggle-replies-' + comment.id + '" onclick="toggleReplies(\'' + comment.id + '\')">' +
                                '▼ Lihat ' + commentReplies.length + ' balasan' +
                            '</button>' +
                            '<div class="replies-list" id="replies-' + comment.id + '" style="display:none;">' +
                                repliesHtml +
                            '</div>' +
                        '</div>';
                    } else {
                        repliesSection = '<div class="replies-section">' +
                            '<div class="replies-list" id="replies-' + comment.id + '" style="display:none;"></div>' +
                        '</div>';
                    }

                    commentElement.innerHTML =
                        '<img src="' + (comment.userPhoto || 'https://via.placeholder.com/32') + '" alt="user" class="comment-avatar" onerror="this.src=\'https://via.placeholder.com/32\'">' +
                        '<div class="comment-body">' +
                            '<div class="comment-meta-row">' +
                                '<span class="comment-username">' + escapeHtml(comment.userName) + '</span>' +
                                ownerBadge +
                                '<span class="comment-time">' + timeStr + '</span>' +
                                (canDeleteComment ? '<button class="comment-delete-btn" onclick="deleteComment(\'' + comment.id + '\', false, null)">🗑</button>' : '') +
                            '</div>' +
                            '<p class="comment-text">' + escapeHtml(comment.text) + '</p>' +
                            (comment.photoUrl ? '<div class="comment-photo-attachment"><img src="' + comment.photoUrl + '" alt="foto komentar" onclick="openCommentPhoto(\'' + comment.photoUrl.replace(/'/g, "\\'") + '\')" onerror="this.parentNode.style.display=\'none\'"></div>' : '') +
                            '<div class="comment-actions-row">' +
                                '<button class="reply-btn" onclick="setReply(\'' + comment.id + '\', \'' + commentUserNameEsc + '\')">↩ Balas</button>' +
                            '</div>' +
                            repliesSection +
                        '</div>';
                    commentsList.appendChild(commentElement);
                });

                document.getElementById('commentCount').textContent = commentsArray.length;
            });
        }

        // ===== COMMENT PHOTO HANDLING =====
        let pendingCommentPhoto = null; // { file, dataUrl }

        window.triggerCommentPhotoInput = function(event) {
            if (event) event.stopPropagation();
            document.getElementById('commentPhotoInput').click();
        };

        window.handleCommentPhotoSelect = function(event) {
            event.stopPropagation();
            const file = event.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                alert('❌ Hanya file gambar yang diizinkan');
                return;
            }
            if (file.size > 5 * 1024 * 1024) {
                alert('❌ Ukuran foto maksimal 5MB');
                event.target.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                pendingCommentPhoto = { file, dataUrl: e.target.result };
                document.getElementById('commentPhotoImg').src = e.target.result;
                document.getElementById('commentPhotoPreview').style.display = 'flex';
            };
            reader.readAsDataURL(file);
            event.target.value = '';

        window.removeCommentPhoto = function(event) {
            if (event) event.stopPropagation();
            pendingCommentPhoto = null;
            document.getElementById('commentPhotoImg').src = '';
            document.getElementById('commentPhotoPreview').style.display = 'none';
        };

        async function uploadCommentPhotoToCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
            formData.append('cloud_name', CLOUDINARY_CLOUD_NAME);
            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
                method: 'POST',
                body: formData
            });
            if (!response.ok) throw new Error('Upload foto gagal');
            const data = await response.json();
            return data.secure_url;
        }

        // Send comment
        window.sendComment = async function(event) {
            if (event) event.stopPropagation();
            
            const currentReel = allReels[currentReelIndex];
            if (!currentReel) {
                alert('❌ Reel tidak ditemukan');
                return;
            }

            const commentInput = document.getElementById('commentInput');
            const text = commentInput.value.trim();

            if (!text && !pendingCommentPhoto) {
                alert('⚠️ Tulis komentar atau pilih foto terlebih dahulu');
                return;
            }

            if (!currentUserData) {
                alert('❌ Data profil belum siap');
                return;
            }

            const sendBtn = document.getElementById('sendCommentBtn');
            sendBtn.disabled = true;
            sendBtn.textContent = '...';

            try {
                let photoUrl = null;
                if (pendingCommentPhoto) {
                    photoUrl = await uploadCommentPhotoToCloudinary(pendingCommentPhoto.file);
                }

                const newCommentRef = push(ref(database, 'reels/' + currentReel.id + '/comments'));
                const commentData = {
                    userName: currentUserData.fullname || 'Unknown',
                    userPhoto: currentUserData.photoURL || 'https://via.placeholder.com/32',
                    text: text || '',
                    userId: currentUser.uid,
                    timestamp: Date.now()
                };

                if (photoUrl) {
                    commentData.photoUrl = photoUrl;
                }

                // If replying, add parentCommentId & replyToName
                if (replyTo) {
                    commentData.parentCommentId = replyTo.commentId;
                    commentData.replyToName = replyTo.userName;
                }

                await set(newCommentRef, commentData);
                console.log('✅ Komentar berhasil ditambahkan');
                commentInput.value = '';
                removeCommentPhoto(null);

                // Auto-expand replies if this is a reply
                if (replyTo) {
                    const repliesEl = document.getElementById('replies-' + replyTo.commentId);
                    if (repliesEl) repliesEl.style.display = 'block';
                    cancelReply(null);
                }

                commentInput.focus();

                // Send notification to reel owner if commenter is not the owner
                if (currentReel.userId !== currentUser.uid) {
                    const notifRef = push(ref(database, 'notifications/' + currentReel.userId));
                    set(notifRef, {
                        type: 'reply_comment',
                        actorName: currentUserData.fullname || 'Seseorang',
                        actorPhoto: currentUserData.photoURL || '',
                        actorId: currentUser.uid,
                        reelId: currentReel.id,
                        text: text.length > 40 ? text.substring(0,40)+'...' : (photoUrl ? '[foto]' : ''),
                        timestamp: Date.now(),
                        read: false
                    }).catch(() => {});
                }
            } catch(error) {
                console.error('❌ Error sending comment:', error);
                alert('❌ Gagal mengirim komentar: ' + error.message);
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Kirim';
            }
        };

                    alert(`❌ File terlalu besar! Max: ${file.type.startsWith('video/') ? '100MB' : '10MB'}`);
                    document.getElementById('reelFile').value = '';

                }

                const reader = new FileReader();

                    } else if (file.type.startsWith('video/')) {

        // Upload ke Cloudinary
        async function uploadToCloudinary(file) {
            return new Promise((resolve, reject) => {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
                formData.append('cloud_name', CLOUDINARY_CLOUD_NAME);

                const xhr = new XMLHttpRequest();

                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percentComplete = Math.round((e.loaded / e.total) * 100);
                        document.getElementById('progressBar').style.width = percentComplete + '%';
                        document.getElementById('progressPercent').textContent = percentComplete + '%';
                    }
                });

                xhr.addEventListener('load', () => {
                    if (xhr.status === 200) {
                        const response = JSON.parse(xhr.responseText);
                        resolve({
                            url: response.secure_url,
                            publicId: response.public_id,
                            type: file.type.startsWith('video/') ? 'video' : 'image'
                        });
                    } else {
                        reject(new Error('Upload failed'));
                    }
                });

                xhr.addEventListener('error', () => {
                    reject(new Error('Upload error'));
                });

                const uploadUrl = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`;
                xhr.open('POST', uploadUrl);
                xhr.send(formData);
            });
        }

            errorDiv.innerHTML = '❌ Video gagal dimuat';
            videoElement.parentNode.appendChild(errorDiv);
        };

        // Handle image error
        window.handleImageError = function(imgElement) {
            console.error('Image failed to load:', imgElement.src);
            imgElement.style.display = 'none';
            const errorDiv = document.createElement('div');
            errorDiv.className = 'media-error';
            errorDiv.innerHTML = '❌ Gambar gagal dimuat';
            imgElement.parentNode.appendChild(errorDiv);
        };
    </script>
</body>
</html>
